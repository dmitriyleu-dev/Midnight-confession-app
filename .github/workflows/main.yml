name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Подготовить проект
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MidnightConfession"
          include(":app")
          EOF

          mkdir -p app/src/main/java/com/midnightconfession/host

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3"
          }

          android {
              namespace = "com.midnightconfession.host"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.midnightconfession.host"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Midnight Confession">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/midnightconfession/host/MainActivity.java <<'EOF'
          package com.midnightconfession.host;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  TextView text = new TextView(this);
                  text.setText("Midnight Confession");
                  text.setTextSize(24);
                  text.setPadding(40, 80, 40, 40);

                  setContentView(text);
              }
          }
          EOF

      - name: Собрать APK
        run: gradle assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: Midnight-Confession-APK
          path: app/build/outputs/apk/debug/app-debug.apk
